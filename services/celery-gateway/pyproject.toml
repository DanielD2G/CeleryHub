[project]
name = "celery-gateway"
version = "0.1.0"
description = "FastAPI microservice for Celery cluster management"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "celery[redis]>=5.4",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=2.0",
    "croniter>=3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fakeredis>=2.25",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celery_gateway"]
