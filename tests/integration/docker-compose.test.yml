services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  celeryhub:
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "3099:3000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERYHUB_AUTH_TOKEN: test-token-123
      PORT: "3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12

  worker:
    build:
      context: ./worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
