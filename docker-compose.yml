services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  celeryhub:
    build: .
    ports:
      - "3000:3000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERYHUB_DB_PATH: /app/data/celeryhub.db
    volumes:
      - celeryhub-data:/app/data
    depends_on:
      - redis

  # ── Uncomment to use PostgreSQL instead of SQLite ──
  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: celeryhub
  #     POSTGRES_PASSWORD: celeryhub
  #     POSTGRES_DB: celeryhub
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #
  # Then add to celeryhub.environment:
  #   DATABASE_URL: postgres://celeryhub:celeryhub@postgres:5432/celeryhub
  # And add postgres to celeryhub.depends_on

volumes:
  redis-data:
  celeryhub-data:
  # postgres-data:
