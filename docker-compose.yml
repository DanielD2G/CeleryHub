services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  celeryhub:
    build: .
    ports:
      - "3000:3000"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - celeryhub-data:/app/data
    depends_on:
      - redis

volumes:
  redis-data:
  celeryhub-data:
